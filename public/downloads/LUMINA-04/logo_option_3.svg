<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
      .brand-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; fill: #1C1C1E; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: 0.35em; fill: #0A84FF; }
      .brand-tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 9px; letter-spacing: 0.22em; fill: #0A84FF; }
    </style>
  </defs>
  <rect width="500" height="500" fill="#F5F5F7" rx="28"/>
  <rect x="22" y="22" width="456" height="456" fill="none" stroke="#00F2FE" stroke-width="0.8" stroke-opacity="0.3" rx="20"/>
  <g id="logo-emblem" transform="translate(250, 185) scale(1)">

    <!-- Khối Đa Giác Công Nghệ / Vi Mạch Số -->
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="none" stroke="#0A84FF" stroke-width="2.8" stroke-linejoin="round"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#1C1C1E" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="16" fill="#0A84FF" opacity="0.15"/>
    <circle cx="0" cy="0" r="6" fill="#00F2FE"/>
    <line x1="0" y1="-85" x2="0" y2="-60" stroke="#00F2FE" stroke-width="2"/>
    <line x1="74" y1="-42" x2="52" y2="-30" stroke="#00F2FE" stroke-width="2"/>
    <line x1="74" y1="42" x2="52" y2="30" stroke="#00F2FE" stroke-width="2"/>
    <line x1="0" y1="85" x2="0" y2="60" stroke="#00F2FE" stroke-width="2"/>
    <line x1="-74" y1="42" x2="-52" y2="30" stroke="#00F2FE" stroke-width="2"/>
    <line x1="-74" y1="-42" x2="-52" y2="-30" stroke="#00F2FE" stroke-width="2"/>
    <circle cx="0" cy="-85" r="4" fill="#00F2FE"/>
    <circle cx="74" cy="-42" r="4" fill="#1C1C1E"/>
    <circle cx="74" cy="42" r="4" fill="#0A84FF"/>
    <circle cx="0" cy="85" r="4" fill="#00F2FE"/>
    <circle cx="-74" cy="42" r="4" fill="#1C1C1E"/>
    <circle cx="-74" cy="-42" r="4" fill="#0A84FF"/>
      
</g>
  <g id="logo-typography">
    <text x="250" y="336" text-anchor="middle" class="brand-title">MORPHIC STUDIO</text>
    <text x="250" y="368" text-anchor="middle" class="brand-sub">INFINITE DIMENSION CUBE</text>
    <g transform="translate(250, 388)">
      <line x1="-60" y1="0" x2="-10" y2="0" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="2.5" fill="#00F2FE"/>
      <line x1="10" y1="0" x2="60" y2="0" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.4"/>
    </g>
    <text x="250" y="414" text-anchor="middle" class="brand-tagline">KIẾN TẠO CẤU TRÚC SỐ TƯƠNG LAI</text>
    <text x="250" y="433" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8" fill="#0A84FF" letter-spacing="0.25em">QUANTUM &amp; CODE</text>
  </g>
</svg>
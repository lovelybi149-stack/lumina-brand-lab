<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
      .brand-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; fill: #1C1C1E; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.35em; fill: #0A84FF; }
      .brand-tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; font-size: 9px; letter-spacing: 0.22em; fill: #0A84FF; }
    </style>
  </defs>
  <rect width="500" height="500" fill="#F5F5F7" rx="28"/>
  <rect x="22" y="22" width="456" height="456" fill="none" stroke="#0A84FF" stroke-width="0.8" stroke-opacity="0.3" rx="20"/>
  <g id="logo-emblem" transform="translate(250, 185) scale(1)">

    <!-- Khối Lập Phương 3D Công Nghệ -->
    <polygon points="0,-75 62,-40 0,-5 -62,-40" fill="#0A84FF" opacity="0.25" stroke="#0A84FF" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="-62,-40 0,-5 0,65 -62,30" fill="#1C1C1E" opacity="0.2" stroke="#1C1C1E" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="0,-5 62,-40 62,30 0,65" fill="#00F2FE" opacity="0.35" stroke="#00F2FE" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-5" r="9" fill="#0A84FF"/>
    <line x1="0" y1="-5" x2="0" y2="-75" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="0" y1="-5" x2="62" y2="30" stroke="#0A84FF" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="0" y1="-5" x2="-62" y2="30" stroke="#1C1C1E" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="0" cy="-75" r="4" fill="#00F2FE"/>
    <circle cx="62" cy="30" r="4" fill="#0A84FF"/>
    <circle cx="-62" cy="30" r="4" fill="#1C1C1E"/>
    
</g>
  <g id="logo-typography">
    <text x="250" y="336" text-anchor="middle" class="brand-title">MORPHIC STUDIO</text>
    <text x="250" y="368" text-anchor="middle" class="brand-sub">AI &amp; DIGITAL VISUAL LAB</text>
    <g transform="translate(250, 388)">
      <line x1="-70" y1="0" x2="-12" y2="0" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="2.5" fill="#00F2FE"/>
      <line x1="12" y1="0" x2="70" y2="0" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.4"/>
    </g>
    <text x="250" y="414" text-anchor="middle" class="brand-tagline">KIẾN TẠO CẤU TRÚC SỐ TƯƠNG LAI</text>
    <text x="250" y="433" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8" fill="#0A84FF" letter-spacing="0.25em">NEXT-GEN STUDIO</text>
  </g>
</svg>
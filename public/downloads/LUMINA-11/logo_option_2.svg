<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap');
      .brand-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 32px; letter-spacing: 0.22em; fill: #111111; }
      .brand-sub { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.40em; fill: #D4AF37; }
      .brand-tagline { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 9px; letter-spacing: 0.25em; fill: #8C827A; }
    </style>
  </defs>
  <rect width="500" height="500" fill="#FFF6F8" rx="28"/>
  <rect x="22" y="22" width="456" height="456" fill="none" stroke="#E05283" stroke-width="0.8" stroke-opacity="0.3" rx="20"/>
  <g id="logo-emblem" transform="translate(250, 185) scale(1.1)">
    <g transform="translate(0, 5)">
      <!-- Vòng C thứ nhất: X = -96 -->
      <path d="M -70,-28 C -92,-40 -124,-24 -124,0 C -124,24 -92,40 -70,28" fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
      <!-- Vòng O thứ nhất: X = -32 -->
      <circle cx="-32" cy="0" r="28" fill="none" stroke="#D4AF37" stroke-width="13"/>
      <!-- Vòng C thứ hai: X = 32 -->
      <path d="M 58,-28 C 36,-40 4,-24 4,0 C 4,24 36,40 58,28" fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
      <!-- Vòng O thứ hai: X = 96 -->
      <circle cx="96" cy="0" r="28" fill="none" stroke="#D4AF37" stroke-width="13"/>
      <!-- Đường phản chiếu gương horizon -->
      <line x1="-125" y1="48" x2="125" y2="48" stroke="#E05283" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="48" r="2.5" fill="#E05283"/>
    </g>
  </g>
  <g id="logo-typography">
    <text x="250" y="336" text-anchor="middle" class="brand-title">COCO</text>
    <text x="250" y="368" text-anchor="middle" class="brand-sub">CONTINUOUS INFINITY FLOW LIGATURE</text>
    <g transform="translate(250, 388)">
      <line x1="-50" y1="0" x2="-10" y2="0" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="2" fill="#D4AF37"/>
      <line x1="10" y1="0" x2="50" y2="0" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
    </g>
    <text x="250" y="414" text-anchor="middle" class="brand-tagline">HƯƠNG THƠM NGỌT NGÀO ĐẾN TỪNG PHÚT GIÂY</text>
    <text x="250" y="433" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="8" fill="#8C827A" letter-spacing="0.25em">EST. 2024</text>
  </g>
</svg>
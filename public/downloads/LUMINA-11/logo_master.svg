<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap');
      .brand-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 32px; letter-spacing: 0.22em; fill: #111111; }
      .brand-sub { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.40em; fill: #D4AF37; }
      .brand-tagline { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 9px; letter-spacing: 0.25em; fill: #8C827A; }
    </style>
    <mask id="opt3-cc-weave-mask">
      <rect x="-150" y="-150" width="300" height="300" fill="#FFFFFF"/>
      <circle cx="0" cy="-34" r="14" fill="#000000"/>
    </mask>
  </defs>
  <rect width="500" height="500" fill="#FBF9F5" rx="28"/>
  <rect x="22" y="22" width="456" height="456" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.35" rx="20"/>
  <g id="logo-emblem" transform="translate(250, 185) scale(1.1)">
    <!-- Khung hình học bảo vệ tỷ lệ vàng -->
    <rect x="-76" y="-76" width="152" height="152" rx="36" fill="none" stroke="#D4AF37" stroke-width="1.4" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#111111" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.35"/>
    <!-- CHỮ C THỨ NHẤT (Bên trái quay sang phải): nét dày 14px chuẩn tỷ lệ vàng -->
    <path d="M 18,-38 C -18,-54 -52,-32 -52,0 C -52,32 -18,54 18,38" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
    <!-- CHỮ C THỨ HAI (Bên phải đối xứng gương quay sang trái) có mặt nạ lồng luồn qua nhau -->
    <path d="M -18,-38 C 18,-54 52,-32 52,0 C 52,32 18,54 -18,38" fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round" mask="url(#opt3-cc-weave-mask)"/>
    <!-- Cầu nối giao điểm trên (Under-over bridge) -->
    <path d="M -4,-38 C 8,-46 22,-42 28,-34" fill="none" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
    <!-- 4 Tinh thể ngọc tại trục đối xứng -->
    <circle cx="0" cy="-76" r="3.2" fill="#D4AF37"/>
    <circle cx="0" cy="76" r="3.2" fill="#D4AF37"/>
    <circle cx="-76" cy="0" r="3.2" fill="#111111"/>
    <circle cx="76" cy="0" r="3.2" fill="#111111"/>
  </g>
  <g id="logo-typography">
    <text x="250" y="336" text-anchor="middle" class="brand-title">COCO</text>
    <text x="250" y="368" text-anchor="middle" class="brand-sub">HAUTE COUTURE INTERLOCKING CC MONOGRAM</text>
    <g transform="translate(250, 388)">
      <line x1="-50" y1="0" x2="-10" y2="0" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="2" fill="#D4AF37"/>
      <line x1="10" y1="0" x2="50" y2="0" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.4"/>
    </g>
    <text x="250" y="414" text-anchor="middle" class="brand-tagline">HƯƠNG THƠM NGỌT NGÀO ĐẾN TỪNG PHÚT GIÂY</text>
    <text x="250" y="433" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="8" fill="#8C827A" letter-spacing="0.25em">ROYAL CC SIGNATURE</text>
  </g>
</svg>